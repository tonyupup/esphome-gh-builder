name: Remote build

# 所有进出本仓库的内容都用 age 加密：bundle 用 BUILD_AGE_PUBKEY 加密后放在 job/<id> 分支，
# 编译结果用调用方每个任务临时生成的 reply_pubkey 加密后作为 artifact。
run-name: build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: job id (branch job/<id> holds bundle.tar.gz.age)
        required: true
      esphome_version:
        description: esphome version to install
        required: true
      reply_pubkey:
        description: age recipient used to encrypt the result
        required: true
      project:
        description: sanitised config name, used only as a per-project build-cache key
        required: true

permissions:
  contents: read
  checks: write     # live log is published through a check run

env:
  DATA_DIR: /home/runner/esphome-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: job/${{ inputs.job }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 所有项目共用的工具缓存：ESP-IDF / Arduino 框架 / 工具链 / pip。
      # 缓存不可变，所以只在内容增长（装了新平台或新版本）时才用新 key 保存一份。
      - name: Restore shared tools cache
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
            ~/.cache/pip
          key: tools-${{ inputs.esphome_version }}-${{ github.run_id }}
          restore-keys: tools-${{ inputs.esphome_version }}-

      - name: Measure tools cache
        id: before
        run: echo "kb=$(du -sk ~/.cache/esphome ~/.platformio ~/.cache/pip 2>/dev/null | awk '{s+=$1} END{print s+0}')" >> "$GITHUB_OUTPUT"

      - name: Restore project build cache
        id: pcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DATA_DIR }}/build
          key: build-${{ inputs.project }}-${{ inputs.esphome_version }}-${{ github.run_id }}
          restore-keys: build-${{ inputs.project }}-${{ inputs.esphome_version }}-

      - name: Install tools
        run: pip install -q "esphome==${{ inputs.esphome_version }}" pyrage==1.2.5

      - name: Decrypt bundle
        env:
          BUILD_AGE_KEY: ${{ secrets.BUILD_AGE_KEY }}
        run: |
          python - <<'EOF'
          import os, pyrage
          ident = pyrage.x25519.Identity.from_str(os.environ["BUILD_AGE_KEY"])
          data = pyrage.decrypt(open("bundle.tar.gz.age", "rb").read(), [ident])
          open("/tmp/bundle.tar.gz", "wb").write(data)
          EOF
          rm bundle.tar.gz.age
          mkdir -p /tmp/cfg && tar -xzf /tmp/bundle.tar.gz -C /tmp/cfg
          rm /tmp/bundle.tar.gz

      # 收集所有需要脱敏的值：secrets.yaml 全部值 + 各 YAML 里 password/key/psk/token 等字段。
      - name: Collect redactions
        run: |
          python - <<'EOF'
          import glob, json, yaml
          class L(yaml.SafeLoader): pass
          L.add_multi_constructor("", lambda loader, suffix, node: None)
          vals, hot = set(), ("password", "key", "psk", "token", "secret", "passphrase")
          def walk(o, top=False):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if top or any(h in str(k).lower() for h in hot):
                          if isinstance(v, (str, int)): vals.add(str(v))
                      walk(v)
              elif isinstance(o, list):
                  for i in o: walk(i)
          for p in glob.glob("/tmp/cfg/**/*.y*ml", recursive=True):
              try: walk(yaml.load(open(p), L), top=p.endswith("secrets.yaml"))
              except Exception: pass
          json.dump(sorted(vals), open("/tmp/redact.json", "w"))
          for v in vals:
              if len(v) >= 4:
                  for part in v.splitlines(): print(f"::add-mask::{part}")
          EOF

      # 编译输出不进 Actions 日志，写文件后由 stream_log.py 脱敏后通过 check run 实时发布，供适配器轮询。
      - name: Compile
        id: compile
        env:
          ESPHOME_DATA_DIR: ${{ env.DATA_DIR }}
          GITHUB_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job }}
        run: |
          cfg="$(python -c "import json;print(json.load(open('/tmp/cfg/.ghbuild.json'))['configuration'])")"
          rm -f /tmp/compile.done; : > /tmp/compile.log
          python ghbuilder/stream_log.py /tmp/compile.log /tmp/compile.done /tmp/redact.json &
          streamer=$!
          set +e
          (cd /tmp/cfg && esphome --dashboard compile "$cfg") > /tmp/compile.log 2>&1
          rc=$?
          touch /tmp/compile.done
          wait $streamer
          exit $rc

      - name: Measure tools cache after
        id: after
        if: always()
        run: echo "kb=$(du -sk ~/.cache/esphome ~/.platformio ~/.cache/pip 2>/dev/null | awk '{s+=$1} END{print s+0}')" >> "$GITHUB_OUTPUT"

      - name: Save shared tools cache
        if: always() && (steps.tools.outputs.cache-hit != 'true') && (steps.after.outputs.kb > steps.before.outputs.kb + 5120)
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
            ~/.cache/pip
          key: tools-${{ inputs.esphome_version }}-${{ github.run_id }}

      - name: Save project build cache
        if: always() && steps.compile.conclusion != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DATA_DIR }}/build
          key: build-${{ inputs.project }}-${{ inputs.esphome_version }}-${{ github.run_id }}

      - name: Pack and encrypt result
        if: success()
        env:
          REPLY_PUBKEY: ${{ inputs.reply_pubkey }}
        run: |
          cd "$DATA_DIR"
          tar -czf /tmp/result.tar.gz idedata storage build
          python - <<'EOF'
          import os, pyrage
          rcpt = pyrage.x25519.Recipient.from_str(os.environ["REPLY_PUBKEY"])
          data = open("/tmp/result.tar.gz", "rb").read()
          open("/tmp/result.tar.gz.age", "wb").write(pyrage.encrypt(data, [rcpt]))
          EOF

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: result-${{ inputs.job }}
          path: /tmp/result.tar.gz.age
          retention-days: 1
          compression-level: 0
